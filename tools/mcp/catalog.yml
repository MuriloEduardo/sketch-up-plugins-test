      add_section_plane: planned
      set_active_section: planned

  selection:
    summary: "Ler e definir a seleção do usuário."
    classes: [Sketchup::Selection]
    tools:
      get_selection: done
      select_entities: planned
      clear_selection: planned

  vision:
    summary: "O agente vê o modelo: imagem da vista e retrato 3D."
    classes: [Sketchup::View]
    tools:
      capture_view: done
      capture_scenes: planned
      zoom_extents: planned

  import_export:
    summary: "Importar e exportar arquivos 2D/3D e imagens."
    classes: [Sketchup::Image, Sketchup::Skp]
    tools:
      import_file: planned
      export_file: planned
      import_image: planned
      get_skp_file_info: planned

  layout:
    summary: "Documentos do LayOut, pranchas, viewports, anotações e PDF."
    classes: [Layout, Layout::AngularDimension, Layout::AutoTextDefinition, Layout::AutoTextDefinitions,
              Layout::ConnectionPoint, Layout::Dictionary, Layout::Document, Layout::Ellipse, Layout::Entities,
              Layout::Entity, Layout::FormattedText, Layout::Grid, Layout::Group, Layout::Image, Layout::Label,
              Layout::Layer, Layout::LayerInstance, Layout::Layers, Layout::LinearDimension, Layout::Page,
              Layout::PageInfo, Layout::Pages, Layout::Path, Layout::Rectangle, Layout::ReferenceEntity,
              Layout::SketchUpModel, Layout::Style, Layout::Table, Layout::TableCell, Layout::TableColumn,
              Layout::TableRow, Geom::Point2d, Geom::Vector2d, Geom::Bounds2d, Geom::OrientedBounds2d,
              Geom::Transformation2d]
    tools:
      generate_layout_sheets: done
      create_layout_document: planned
      open_layout_document: planned
      list_layout_pages: planned
      add_layout_page: planned
      add_layout_viewport: planned
      add_layout_text: planned
      add_layout_table: planned
      add_layout_dimension: planned
      add_layout_label: planned
      add_layout_image: planned
      add_layout_shape: planned
      set_auto_text: planned
      set_layout_page_info: planned
      export_layout: planned

  vray:
    summary: "Render V-Ray, configurações, materiais, luzes, câmera, lote e arquivos."
    classes: [VRay::AColor, VRay::Color, VRay::Matrix, VRay::Vector, VRay::Transform, VRay::ModelExporter,
              VRay::Proxy, VRay::Scene, VRay::Scene::ChangeSet, VRay::Scene::Plugin, VRay::ScenePreview,
              VRay::UVTextureSampler, VRay::VRayImage, VRay::VRayRenderer, VRay::VRayRenderer::Plugin,
              VRay::GeomUtils, VRay::Context, VRay::Command, VRay::BatchExporter]
    tools:
      vray_status: done
      get_render_settings: done
      set_render_settings: done
      apply_quality_preset: planned
      list_vray_materials: planned
      create_vray_material: planned
      update_vray_material: planned
      material_preview: planned
      list_lights: done
      create_light: done
      update_light: done
      set_environment_hdri: planned
      set_physical_camera: planned
      render_scene: done
      get_render_status: done
      cancel_render: done
      render_all_scenes: planned
      render_material_variations: planned
      export_vrscene: planned
      list_missing_files: planned
      relink_files: planned
      create_proxy: planned

  reports:
    summary: "Relatórios e quantitativos (features)."
    classes: []
    tools:
      audit_scene: done
      quantity_takeoff: planned
      component_schedule: planned

  app:
    summary: "SketchUp como aplicativo e conversa com o usuário."
    classes: [UI, UI::Notification, Sketchup::ExtensionsManager]
    tools:
      notify_user: planned
      ask_user_confirmation: planned
      list_extensions: planned

  workflows:
    summary: "Fluxos completos que encadeiam vários grupos."
    classes: []
    tools:
      presentation_package: planned
      turntable_render: planned
      audit_and_fix: planned

internal:
  _top_level.rb: carregamento de arquivos da extensão (file_loaded?), não é ação
  LanguageHandler: traduções da própria extensão (usamos I18n)
  SketchupExtension: registro da extensão
  Sketchup::Console: console Ruby de desenvolvimento
  Sketchup::Menu: menus da extensão (Commands/Menu)
  UI::Command: comandos da extensão
  UI::Toolbar: barra de ferramentas da extensão
  UI::HtmlDialog: janelas da extensão
  UI::WebDialog: legado, substituído por HtmlDialog
  Sketchup::Tool: ferramenta interativa (mouse do usuário), não serve a um agente
  Sketchup::Tools: pilha de ferramentas interativas
  Sketchup::InputPoint: inferência do mouse
  Sketchup::PickHelper: seleção pelo mouse
  Sketchup::Overlay: desenho sobre a vista; candidato a mostrar o que o agente faz (futuro)
  Sketchup::OverlaysManager: gerência de overlays
  Sketchup::Importer: registrar importadores próprios (usamos Model#import)
  Sketchup::LoadHandler: progresso de carga de componentes
  Sketchup::Licensing: licença da extensão (pilar P7)
  Sketchup::Licensing::ExtensionLicense: licença da extensão (pilar P7)
  Sketchup::Http: rede; usada pelo relay (Modo 2), não exposta ao agente
  Sketchup::Http::Request: rede (relay)
  Sketchup::Http::Response: rede (relay)
  Layout::LockedEntityError: vira erro legível da ferramenta
  Layout::LockedLayerError: vira erro legível da ferramenta
  VRay::VRayInit: inicialização do V-Ray fora do SketchUp
  Sketchup::AppObserver: observador; vira evento no barramento (Events)
  Sketchup::DefinitionObserver: observador; vira evento
  Sketchup::DefinitionsObserver: observador; vira evento
  Sketchup::DimensionObserver: observador; vira evento
  Sketchup::EntitiesObserver: observador; vira evento
  Sketchup::EntityObserver: observador; vira evento
  Sketchup::EnvironmentsObserver: observador; vira evento
  Sketchup::FrameChangeObserver: observador; vira evento
  Sketchup::InstanceObserver: observador; vira evento
  Sketchup::LayersObserver: observador; vira evento
  Sketchup::MaterialsObserver: observador; vira evento
  Sketchup::ModelObserver: observador; vira evento
  Sketchup::OptionsProviderObserver: observador; vira evento
  Sketchup::PagesObserver: observador; vira evento
  Sketchup::RenderingOptionsObserver: observador; vira evento
  Sketchup::SelectionObserver: observador; vira evento
  Sketchup::ShadowInfoObserver: observador; vira evento
  Sketchup::ToolsObserver: observador; vira evento
  Sketchup::ViewObserver: observador; vira evento
