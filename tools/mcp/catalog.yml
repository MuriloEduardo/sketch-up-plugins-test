# Catálogo das ferramentas MCP (docs/mcp.md).
#
# Regras verificadas por tests/unit/mcp/catalog_test.rb:
# - toda classe de docs/reference/sketchup-api-index.md e toda classe V-Ray
#   de VRAY_CLASSES aparece exatamente uma vez: em `classes` de um grupo ou
#   em `internal` (com o motivo);
# - toda ferramenta `done` existe no código (Actions.register name: '...');
# - toda ação registrada no código está aqui.
#
# status: done | planned

groups:
  model:
    summary: "O modelo como um todo, unidades, opções, georreferência, ambientes, classificação, desfazer."
    classes: [Sketchup, Sketchup::Model, Sketchup::OptionsManager, Sketchup::OptionsProvider,
              Sketchup::RegionalSettings, Sketchup::Axes, Sketchup::Environment, Sketchup::Environments,
              Sketchup::ClassificationSchema, Sketchup::Classifications, Geom::LatLong, Geom::UTM]
    tools:
      model_info: done
      get_model_options: planned
      set_units: planned
      save_model: planned
      save_model_copy: planned
      undo_last: planned
      purge_unused: planned
      get_georeference: planned
      set_georeference: planned
      list_environments: planned
      set_environment: planned
      list_classifications: planned
      classify_entity: planned

  inspect:
    summary: "Consultar, inspecionar e alterar qualquer entidade (camada genérica e segura) e atributos."
    classes: [Sketchup::Entity, Sketchup::Drawingelement, Sketchup::Entities, Sketchup::InstancePath,
              Sketchup::AttributeDictionary, Sketchup::AttributeDictionaries, Sketchup::Set]
    tools:
      query_entities: planned
      inspect_entity: planned
      set_entity_properties: planned
      find_by_persistent_id: planned
      get_attributes: planned
      set_attributes: planned
      delete_attributes: planned

  geometry:
    summary: "Criar e editar geometria; medidas; malha 3D."
    classes: [Geom, Geom::Point3d, Geom::Vector3d, Geom::BoundingBox, Geom::PolygonMesh,
              Sketchup::EntitiesBuilder, Sketchup::Face, Sketchup::Edge, Sketchup::Vertex, Sketchup::Loop,
              Sketchup::EdgeUse, Sketchup::Curve, Sketchup::ArcCurve, Array, Numeric, Length, String]
    tools:
      create_box: planned
      create_face: planned
      create_edges: planned
      create_circle: planned
      create_arc: planned
      create_polygon: planned
      pushpull_face: planned
      followme: planned
      offset_face: planned
      intersect_entities: planned
      soften_edges: planned
      erase_entities: planned
      measure_distance: planned
      compute_area: planned
      get_model_mesh: planned
      create_wall: planned
      create_slab: planned
      cut_opening: planned

  transform:
    summary: "Mover, girar, escalar, espelhar, copiar em matriz, explodir."
    classes: [Geom::Transformation]
    tools:
      move_entities: planned
      rotate_entities: planned
      scale_entities: planned
      mirror_entities: planned
      array_copies: planned
      explode_entities: planned

  components:
    summary: "Componentes, grupos, definições, comportamento, componentes dinâmicos."
    classes: [Sketchup::ComponentDefinition, Sketchup::ComponentInstance, Sketchup::Group,
              Sketchup::DefinitionList, Sketchup::Behavior, Sketchup::Snap]
    tools:
      list_components: done
      list_instances: planned
      place_component: planned
      load_component_file: planned
      create_component: planned
      create_group: planned
      make_unique: planned
      replace_definition: planned
      rename_definition: planned
      set_component_behavior: planned
      save_component_as: planned
      get_dynamic_attributes: planned
      set_dynamic_attributes: planned

  materials:
    summary: "Materiais do SketchUp, texturas e cores."
    classes: [Sketchup::Material, Sketchup::Materials, Sketchup::Texture, Sketchup::TextureWriter,
              Sketchup::UVHelper, Sketchup::Color, Sketchup::ImageRep]
    tools:
      list_materials: done
      create_material: planned
      update_material: planned
      apply_material: planned
      replace_material: planned
      load_material_file: planned
      export_textures: planned
      purge_materials: planned

  tags:
    summary: "Tags (layers), pastas e tracejados."
    classes: [Sketchup::Layer, Sketchup::Layers, Sketchup::LayerFolder, Sketchup::LineStyle, Sketchup::LineStyles]
    tools:
      list_tags: done
      create_tag: planned
      update_tag: planned
      delete_tag: planned
      create_tag_folder: planned
      move_to_tag: planned
      list_line_styles: planned

  scenes:
    summary: "Cenas, câmera, estilos, sombras e opções de exibição."
    classes: [Sketchup::Page, Sketchup::Pages, Sketchup::Camera, Sketchup::Animation, Sketchup::Style,
              Sketchup::Styles, Sketchup::RenderingOptions, Sketchup::ShadowInfo]
    tools:
      list_scenes: done
      create_scene: done
      activate_scene: done
      update_scene: planned
      delete_scene: planned
      reorder_scenes: planned
      get_camera: planned
      set_camera: planned
      set_standard_view: planned
      set_shadows: planned
      list_styles: planned
      apply_style: planned
