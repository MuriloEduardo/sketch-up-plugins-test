# Roda a mesma toolchain Docker do dia a dia (ver Makefile/compose.yaml).
# SketchUp/V-Ray não existem no runner: só lint, testes unitários e .rbz.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build toolchain image
        run: make build

      - name: Lint (RuboCop + RuboCop-SketchUp)
        run: make lint

      - name: Unit tests
        run: make test

      - name: Package .rbz
        run: make package

      - name: Upload .rbz
        uses: actions/upload-artifact@v4
        with:
          name: rbz-${{ github.sha }}
          path: dist/*.rbz
          if-no-files-found: error
          retention-days: 30
